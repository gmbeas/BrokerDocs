name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run package
      - name: Verificar que el CLI del plugin está actualizado
        run: git diff --exit-code -- ../plugin || (echo "Ejecuta 'npm run build' en extension/ y sube plugin/ actualizado" && exit 1)
      - name: Publicar .vsix en la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" brokerdocs-*.vsix --clobber || gh release create "${GITHUB_REF_NAME}" brokerdocs-*.vsix --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
