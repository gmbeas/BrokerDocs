name: release

# Publica una release cuando cambia la versión de extension/package.json en main
# (o al subir un tag vX.Y.Z, o a mano desde la pestaña Actions).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run package

      - name: Verificar que el CLI del plugin está actualizado
        run: git diff --exit-code -- ../plugin || (echo "::error::Ejecuta 'npm run build' en extension/ y sube plugin/ actualizado" && exit 1)

      - name: Publicar release si la versión es nueva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "La release $VERSION ya existe: se actualiza el .vsix"
            gh release upload "$VERSION" brokerdocs-*.vsix --clobber
          else
            NOTES=$(awk '/^## /{n++} n==1' CHANGELOG.md)
            gh release create "$VERSION" brokerdocs-*.vsix --target "$GITHUB_SHA" --title "BrokerDocs ${VERSION#v}" --notes "$NOTES"
          fi
